[workspace]
members = ["crates/git-ingest-core", "src-tauri"]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"
authors = ["Aung Myo Kyaw"]
repository = "https://github.com/AungMyoKyaw/git-ingest-desktop"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
