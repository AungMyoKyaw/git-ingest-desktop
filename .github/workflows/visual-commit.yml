name: visual-commit

on:
  push:
    branches:
      - rewrite/tauri-svelte-v1-recovered
    paths:
      - .github/workflows/visual-commit.yml

permissions:
  contents: write

jobs:
  visual:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run visual:test
      - name: Commit verified screenshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/screenshots/v1-*.png
          git commit -m 'docs: add verified v1 screenshots'
          git push
