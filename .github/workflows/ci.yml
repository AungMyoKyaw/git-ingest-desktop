name: CI

on:
  push:
    branches: [master, "rewrite/**", "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt,clippy,llvm-tools-preview
      - name: Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      - name: Format
        run: bun run format:check
      - name: Lint
        run: bun run lint
      - name: Type check
        run: bun run typecheck
      - name: Zero skipped/focused tests
        run: bun run test:skips
      - name: Tests
        run: bun run test
      - name: Frontend coverage
        run: bun run coverage:frontend
      - name: Install Rust coverage tool
        run: cargo install cargo-llvm-cov --locked
      - name: Rust coverage
        run: bun run coverage:rust
      - name: Install Rust audit tool
        run: cargo install cargo-audit --locked
      - name: Security audit
        run: bun run audit
      - name: Production frontend build
        run: bun run build
      - name: Tauri compile check
        run: cargo check --workspace --all-features --locked
      - name: Measure frontend bundle
        run: du -sk dist | tee bundle-size.txt
      - uses: actions/upload-artifact@v6
        with:
          name: verification-reports
          path: |
            coverage/
            bundle-size.txt
          retention-days: 14

  visual:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run visual:test
      - uses: actions/upload-artifact@v6
        with:
          name: v1-ui-screenshots
          path: assets/screenshots/v1-*.png
          if-no-files-found: error
          retention-days: 30
