name: rust-autofix

on:
  push:
    branches:
      - rewrite/tauri-svelte-v1-recovered
    paths:
      - .github/workflows/rust-autofix.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt
      - name: Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - name: Apply machine-safe Clippy fixes
        run: cargo clippy --fix --allow-dirty --allow-staged --workspace --all-targets --all-features
      - run: cargo fmt --all
      - name: Verify strict Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates src-tauri
          git diff --cached --quiet && exit 0
          git commit -m 'style: apply Clippy fixes'
          git push
