name: lint-diagnostics

on:
  push:
    branches:
      - rewrite/tauri-svelte-v1-recovered
    paths:
      - .github/workflows/lint-diagnostics.yml

permissions:
  contents: read

jobs:
  clippy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: clippy
      - name: Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - name: Capture Clippy diagnostics
        id: lint
        continue-on-error: true
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings > clippy.log 2>&1
      - uses: actions/upload-artifact@v6
        with:
          name: clippy-diagnostics
          path: clippy.log
          retention-days: 1
      - name: Preserve lint failure
        if: steps.lint.outcome == 'failure'
        run: exit 1
