name: lint-diagnostics

on:
  push:
    branches:
      - rewrite/tauri-svelte-v1-recovered
    paths:
      - .github/workflows/lint-diagnostics.yml

permissions:
  contents: read

jobs:
  eslint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Capture ESLint diagnostics
        id: lint
        continue-on-error: true
        run: bunx eslint . --max-warnings 0 > eslint.log 2>&1
      - uses: actions/upload-artifact@v6
        with:
          name: eslint-diagnostics
          path: eslint.log
          retention-days: 1
      - name: Preserve lint failure
        if: steps.lint.outcome == 'failure'
        run: exit 1
